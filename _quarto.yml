    - part: "Módulo 2: Modelos IA"
      chapters:
        # - sensores_iot.qmd
        - nlp_participacion.qmd
        - analisis_sentimientos.qmd
        - integracion_datos.qmd
    - recursos_complementarios.qmd
    - part: "Modelos"
      chapters:
        - rc_google.qmd
        - rc_chatgpt.qmd
        - rc_claude.qmd
        - rc_latamgpt.qmd
    - part: "IDEs"
