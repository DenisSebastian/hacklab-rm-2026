        - rc_ide_antigravity.qmd
        - rc_ide_codex.qmd
        - rc_ide_claude.qmd
    - part: "Otros Recursos"
      chapters:
        - rc_notebooklm.qmd
        - rc_perplexity.qmd
        - rc_otras_herramientas.qmd
        - rc_openclaw.qmd
        - rc_hermes.qmd
    - part: "Información Espacial"
      chapters:
        - data_vec.qmd
        - data_sat.qmd
        - books_spatial.qmd
    - part: "Casos"
